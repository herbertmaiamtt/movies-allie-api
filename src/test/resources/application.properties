spring.application.name=movies-allie-api-test

# JWT para ambiente de teste (chave base64 válida de 256 bits)
jwt.secret=dGhpcy1pcy1hLXNhbXBsZS1qd3Qtc2VjcmV0LWtleS1mb3ItdGVzdHM=
jwt.expiration=86400000

# TMDB
tmdb.base-url=https://api.themoviedb.org/3
tmdb.token=test-tmdb-token
tmdb.poster-size=w500

# Banco de dados em memória para testes
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.auto-commit=false

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false
