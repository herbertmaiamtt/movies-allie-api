# SQLite (dev)
spring.datasource.url=jdbc:sqlite:./data/dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Configurações críticas para SQLite com HikariCP
# SQLite só permite uma escrita por vez. Limitar a pool a 1 conexão
# evita o erro "database is locked"
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.auto-commit=false

# Dialeto do Hibernate para SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Flyway em dev: desabilitado por enquanto.
# Vamos usar o ddl-auto=update do Hibernate para criar as tabelas
# enquanto você ainda está modelando as entidades. Depois migramos
# para o Flyway com placeholders para suportar os dois dialetos.
spring.flyway.enabled=false