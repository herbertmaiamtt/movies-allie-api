# SQLite (dev)
spring.datasource.url=jdbc:sqlite:./data/dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Configurações críticas para SQLite com HikariCP
# SQLite só permite uma escrita por vez. Limitar a pool a 1 conexão
# evita o erro "database is locked".
# connection-init-sql ativa o suporte a FOREIGN KEY (ON DELETE CASCADE) no SQLite.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON;

# Dialeto do Hibernate para SQLite
# O Flyway gerencia a criação das tabelas; o ddl-auto do Hibernate fica desativado (none)
# pois no SQLite toda PK auto-incrementável é INTEGER (64-bit rowid), enquanto em prod (PostgreSQL) usa validate.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none

# Flyway habilitado com placeholder cross-dialect para chave primária auto-incrementável no SQLite
spring.flyway.enabled=true
spring.flyway.placeholders.id_type=INTEGER PRIMARY KEY AUTOINCREMENT